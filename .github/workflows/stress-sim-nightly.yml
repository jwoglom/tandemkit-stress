# Six hours of the simulator stress job (stress-sim-job.yml) every night from 02:00 New York time: closed-beta Trio
# with TandemKit dev, ThreadSanitizer, cycling intensity, issues filed for findings.
name: Stress nightly (6 h)

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  issues: write

# Shared with stress-sim-manual.yml: both use the same simulator and build cache on the runner.
concurrency:
  group: stress-sim
  cancel-in-progress: false

jobs:
  stress:
    uses: ./.github/workflows/stress-sim-job.yml
    with:
      minutes: 360
      timeout_minutes: 375
    secrets:
      TRIO_E2E_APP_ID: ${{ secrets.TRIO_E2E_APP_ID }}
      TRIO_E2E_APP_KEY: ${{ secrets.TRIO_E2E_APP_KEY }}
