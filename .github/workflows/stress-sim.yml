# The TandemKit stress lane, four hours a night: Trio (nightscout/Trio feat/tandem-closed-beta) with its TandemKit
# submodule moved to TandemKit dev, built with the virtual pump and ThreadSanitizer, on the iOS Simulator against
# faketandem, while `tandemkit-stress run` injects pump-side events, link faults and app kills (docs/lane.md).
# Findings become issues in this repository: one per fingerprint, a repeat comments on the open issue.
#   gh workflow run stress-sim.yml -R jwoglom/tandemkit-stress -f tandemkit=jwoglom/TandemKit#470 -f seed=42
name: Stress (simulator + faketandem)
run-name: "stress: TandemKit ${{ inputs.tandemkit || 'dev' }}${{ inputs.seed && format(' seed {0}', inputs.seed) || '' }}"

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      trio:
        description: "Trio branch spec"
        type: string
        default: "nightscout/Trio:feat/tandem-closed-beta"
      tandemkit:
        description: "TandemKit ref for the submodule: branch, sha, owner/repo@branch or a PR"
        type: string
        default: dev
      minutes:
        description: "Run budget in minutes, build included (at most 225: the job's limit is 240)"
        type: string
        default: "225"
      faketandem_ref:
        description: "faketandem branch/tag/sha (blank: main)"
        type: string
      harness_ref:
        description: "trio-test-harness ref (blank: the commit the submodule pins)"
        type: string
      seed:
        description: "Chaos seed (blank: random)"
        type: string
      intensity:
        description: "Chaos intensity"
        type: choice
        options: [cycle, medium, high, low]
        default: cycle
      sanitizer:
        description: "Sanitizer"
        type: choice
        options: [thread, address, none]
        default: thread
      categories:
        description: "Chaos categories (comma-separated subset of pump,link,app,ui; blank: all)"
        type: string
      file_issues:
        description: "File issues for findings"
        type: boolean
        default: true
      xcode:
        description: "Xcode"
        type: choice
        options: ["26.2"]
        default: "26.2"

permissions:
  contents: read
  issues: write

concurrency:
  group: stress-sim
  cancel-in-progress: false

jobs:
  stress:
    runs-on: [self-hosted, macOS, worker]
    timeout-minutes: 240
    env:
      # Inputs reach scripts only through env, never interpolated into them. A scheduled run has no inputs.
      IN_TRIO: ${{ inputs.trio || 'nightscout/Trio:feat/tandem-closed-beta' }}
      IN_TANDEMKIT: ${{ inputs.tandemkit || 'dev' }}
      IN_MINUTES: ${{ inputs.minutes || '225' }}
      IN_FAKETANDEM_REF: ${{ inputs.faketandem_ref }}
      IN_SEED: ${{ inputs.seed }}
      IN_INTENSITY: ${{ inputs.intensity || 'cycle' }}
      IN_SANITIZER: ${{ inputs.sanitizer || 'thread' }}
      IN_CATEGORIES: ${{ inputs.categories }}
      TH_XCODE_APP: /Applications/Xcode_${{ inputs.xcode || '26.2' }}.app
      TH_SIM_DEVICE: iPhone 17
      TH_TRIO_ORIGIN: nightscout/Trio
      TH_TRIO_REFERENCE: /Volumes/work/mirrors/nightscout/Trio.git
      TH_GIT_MIRRORS: /Volumes/work/mirrors
      TH_WDA_PREBUILT: /Volumes/work/cache/wda/current
    steps:
      # The run's deadline counts from here, leaving the end of the job for issues and artifacts.
      - name: Start the clock
        run: |
          minutes=225
          if [[ "$IN_MINUTES" =~ ^[0-9]+$ ]] && (( 10#$IN_MINUTES < 225 )); then minutes=$(( 10#$IN_MINUTES )); fi
          echo "STRESS_DEADLINE=$(( $(date +%s) + minutes * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Pinned trio-test-harness commit
        id: pin
        env:
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: echo "ref=${HARNESS_REF:-$(git ls-tree HEAD trio-test-harness | awk '{print $3}')}" >> "$GITHUB_OUTPUT"

      # Contents: read on jwoglom/trio-test-harness (the submodule) and jwoglom/TandemKit (Trio's submodule). An App
      # token lasts an hour: the lane fetches everything it needs from GitHub in its first minutes.
      - name: GitHub App token (jwoglom)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: jwoglom
          repositories: trio-test-harness,TandemKit

      - name: Checkout trio-test-harness
        uses: actions/checkout@v4
        with:
          repository: jwoglom/trio-test-harness
          ref: ${{ steps.pin.outputs.ref }}
          path: trio-test-harness
          token: ${{ steps.token.outputs.token }}

      # A cold Trio build with ThreadSanitizer is long; keeping the checkout and DerivedData between nights makes the
      # build incremental (usually only TandemKit changed) and leaves the rest of the four hours to the rounds.
      - name: Persistent build cache
        run: |
          set -euo pipefail
          cache=/Volumes/work/cache/tandemkit-stress
          if ! mkdir -p "$cache" 2>/dev/null || [ ! -w "$cache" ]; then
            cache="$HOME/Library/Caches/tandemkit-stress"
            mkdir -p "$cache"
          fi
          echo "build cache: $cache"
          {
            echo "TRIO_REPO=$cache/Trio"
            echo "TH_DERIVED_DATA=$cache/DerivedData"
            echo "TH_BUILD_DIR=$cache/build"
          } >> "$GITHUB_ENV"

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt -r trio-test-harness/requirements.txt

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests

      # faketandem is Go; it runs pumpX2's cliparser (Java 17+) for message parsing.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stress run
        id: stress
        env:
          TH_GIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -uo pipefail
          args=(--trio "$IN_TRIO" --tandemkit "$IN_TANDEMKIT" --deadline "$STRESS_DEADLINE"
                --intensity "$IN_INTENSITY" --sanitizer "$IN_SANITIZER" --result-json "$RUNNER_TEMP/stress-result.json")
          [ -z "$IN_FAKETANDEM_REF" ] || args+=(--faketandem-ref "$IN_FAKETANDEM_REF")
          [ -z "$IN_SEED" ] || args+=(--seed "$IN_SEED")
          [ -z "$IN_CATEGORIES" ] || args+=(--categories "$IN_CATEGORIES")
          rc=0
          ./tandemkit-stress run "${args[@]}" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          run_dir=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_dir"])' \
                    "$RUNNER_TEMP/stress-result.json" 2>/dev/null || true)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          exit 0

      # 1: findings, 3: Trio does not build against this TandemKit. A confirmed driver bug is promoted to TandemKit by
      # a person; nothing is filed there from here.
      - name: File issues
        if: always() && steps.stress.outputs.run_dir != '' && (steps.stress.outputs.rc == '1' || steps.stress.outputs.rc == '3') && (github.event_name == 'schedule' || inputs.file_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.stress.outputs.run_dir }}
        run: ./tandemkit-stress file-issues "$RUN_DIR" --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        if: always() && steps.stress.outputs.run_dir != ''
        env:
          RUN_DIR: ${{ steps.stress.outputs.run_dir }}
        run: cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run (findings, logs, crash reports, faketandem request log)
        if: always() && steps.stress.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: tandemkit-stress-${{ github.run_id }}
          path: ${{ steps.stress.outputs.run_dir }}
          retention-days: 14

      - name: Result
        if: always()
        env:
          RC: ${{ steps.stress.outputs.rc }}
        run: |
          case "${RC:-2}" in
            0) echo "clean (or built without time left to run; see the summary)" ;;
            1) echo "::error title=Stress findings::see the job summary and the issues filed"; exit 1 ;;
            3) echo "::error title=Build break::Trio does not build against this TandemKit"; exit 1 ;;
            *) echo "::error title=Harness error::the stress run did not complete; see the step log"; exit 1 ;;
          esac
