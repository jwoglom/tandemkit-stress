# The simulator stress job (stress-sim-job.yml), started by hand: a build, then stress for as long as asked (an hour by
# default) on a TandemKit branch or PR, with a seed to reproduce, another intensity or chaos mix.
#   gh workflow run stress-sim-manual.yml -R jwoglom/tandemkit-stress -f tandemkit=jwoglom/TandemKit#470 -f seed=42
#   gh workflow run stress-sim-manual.yml -R jwoglom/tandemkit-stress -f minutes=240
name: Stress manual
run-name: "stress: TandemKit ${{ inputs.tandemkit }}, ${{ inputs.minutes }} min${{ inputs.seed && format(', seed {0}', inputs.seed) || '' }}"

on:
  workflow_dispatch:
    inputs:
      tandemkit:
        description: "TandemKit ref for the submodule: branch, sha, owner/repo@branch or a PR"
        type: string
        default: dev
      trio:
        description: "Trio branch spec"
        type: string
        default: "nightscout/Trio:feat/tandem-closed-beta"
      minutes:
        description: "Minutes of stress, after the build and simulator setup (the runners stop a job at 4 hours, so at most about 3 hours)"
        type: number
        default: 60
      build_minutes:
        description: "Most minutes the build may take (a cold ThreadSanitizer build is long; the next run continues one stopped here)"
        type: number
        default: 120
      seed:
        description: "Chaos seed (blank: random)"
        type: string
      intensity:
        description: "Chaos intensity"
        type: choice
        options: [cycle, medium, high, low]
        default: cycle
      sanitizer:
        description: "Sanitizer"
        type: choice
        options: [thread, address, none]
        default: thread
      categories:
        description: "Chaos categories (comma-separated subset of pump,link,app,ui; blank: all)"
        type: string
      faketandem_ref:
        description: "faketandem branch/tag/sha (blank: main)"
        type: string
      harness_ref:
        description: "trio-test-harness ref (blank: the commit the submodule pins)"
        type: string
      file_issues:
        description: "File issues for findings"
        type: boolean
        default: true
      xcode:
        description: "Xcode"
        type: choice
        options: ["26.2"]
        default: "26.2"

# contents: write is for the release assets that issues attach files with (tkstress/issues.py, attach).
permissions:
  contents: write
  issues: write

# Shared with stress-sim-nightly.yml: both use the same simulator and build cache on the runner.
concurrency:
  group: stress-sim
  cancel-in-progress: false

jobs:
  stress:
    uses: ./.github/workflows/stress-sim-job.yml
    with:
      # A workflow_dispatch number input arrives as a string; the job's inputs are numbers.
      minutes: ${{ fromJSON(inputs.minutes) }}
      build_minutes: ${{ fromJSON(inputs.build_minutes) }}
      tandemkit: ${{ inputs.tandemkit }}
      trio: ${{ inputs.trio }}
      seed: ${{ inputs.seed }}
      intensity: ${{ inputs.intensity }}
      sanitizer: ${{ inputs.sanitizer }}
      categories: ${{ inputs.categories }}
      faketandem_ref: ${{ inputs.faketandem_ref }}
      harness_ref: ${{ inputs.harness_ref }}
      file_issues: ${{ inputs.file_issues }}
      xcode: ${{ inputs.xcode }}
    secrets:
      TRIO_E2E_APP_ID: ${{ secrets.TRIO_E2E_APP_ID }}
      TRIO_E2E_APP_KEY: ${{ secrets.TRIO_E2E_APP_KEY }}
