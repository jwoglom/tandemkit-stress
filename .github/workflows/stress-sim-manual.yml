# The simulator stress job (stress-sim-job.yml), started by hand for as long as asked (an hour by default): a TandemKit
# branch or PR, a seed to reproduce, another intensity or chaos mix.
#   gh workflow run stress-sim-manual.yml -R jwoglom/tandemkit-stress -f tandemkit=jwoglom/TandemKit#470 -f seed=42
#   gh workflow run stress-sim-manual.yml -R jwoglom/tandemkit-stress -f minutes=240
name: Stress manual
run-name: "stress: TandemKit ${{ inputs.tandemkit }}, ${{ inputs.minutes }} min${{ inputs.seed && format(', seed {0}', inputs.seed) || '' }}"

on:
  workflow_dispatch:
    inputs:
      tandemkit:
        description: "TandemKit ref for the submodule: branch, sha, owner/repo@branch or a PR"
        type: string
        default: dev
      trio:
        description: "Trio branch spec"
        type: string
        default: "nightscout/Trio:feat/tandem-closed-beta"
      minutes:
        description: "Run budget in minutes, build included (1 to 1425)"
        type: number
        default: 60
      seed:
        description: "Chaos seed (blank: random)"
        type: string
      intensity:
        description: "Chaos intensity"
        type: choice
        options: [cycle, medium, high, low]
        default: cycle
      sanitizer:
        description: "Sanitizer"
        type: choice
        options: [thread, address, none]
        default: thread
      categories:
        description: "Chaos categories (comma-separated subset of pump,link,app,ui; blank: all)"
        type: string
      faketandem_ref:
        description: "faketandem branch/tag/sha (blank: main)"
        type: string
      harness_ref:
        description: "trio-test-harness ref (blank: the commit the submodule pins)"
        type: string
      file_issues:
        description: "File issues for findings"
        type: boolean
        default: true
      xcode:
        description: "Xcode"
        type: choice
        options: ["26.2"]
        default: "26.2"

permissions:
  contents: read
  issues: write

# Shared with stress-sim-nightly.yml: both use the same simulator and build cache on the runner.
concurrency:
  group: stress-sim
  cancel-in-progress: false

jobs:
  # The job's limit is the run budget plus 15 minutes for issues and artifacts, and expressions cannot add. The 24-hour
  # ceiling is GITHUB_TOKEN's lifetime, which the job needs at the end to file issues.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      minutes: ${{ steps.plan.outputs.minutes }}
      timeout: ${{ steps.plan.outputs.timeout }}
    steps:
      - id: plan
        env:
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          if ! [[ "$IN_MINUTES" =~ ^[0-9]+$ ]] || (( 10#$IN_MINUTES < 1 || 10#$IN_MINUTES > 1425 )); then
            echo "::error title=minutes::must be a whole number from 1 to 1425"
            exit 1
          fi
          minutes=$(( 10#$IN_MINUTES ))
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "timeout=$(( minutes + 15 ))" >> "$GITHUB_OUTPUT"

  stress:
    needs: plan
    uses: ./.github/workflows/stress-sim-job.yml
    with:
      minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
      tandemkit: ${{ inputs.tandemkit }}
      trio: ${{ inputs.trio }}
      seed: ${{ inputs.seed }}
      intensity: ${{ inputs.intensity }}
      sanitizer: ${{ inputs.sanitizer }}
      categories: ${{ inputs.categories }}
      faketandem_ref: ${{ inputs.faketandem_ref }}
      harness_ref: ${{ inputs.harness_ref }}
      file_issues: ${{ inputs.file_issues }}
      xcode: ${{ inputs.xcode }}
    secrets:
      TRIO_E2E_APP_ID: ${{ secrets.TRIO_E2E_APP_ID }}
      TRIO_E2E_APP_KEY: ${{ secrets.TRIO_E2E_APP_KEY }}
