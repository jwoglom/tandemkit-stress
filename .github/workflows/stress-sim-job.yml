# The simulator stress job: Trio (nightscout/Trio feat/tandem-closed-beta) with its TandemKit submodule moved to
# TandemKit dev, built with the virtual pump and ThreadSanitizer, on the iOS Simulator against faketandem, while
# `tandemkit-stress run` injects pump-side events, link faults and app kills (docs/lane.md). Findings become issues in
# this repository: one per fingerprint, a repeat comments on the open issue.
# The build is its own step, with its own limit, and `minutes` is the stress alone.
# It has no trigger of its own: stress-sim-nightly.yml (6 hours from 02:00 New York time) and stress-sim-manual.yml
# (on demand, an hour by default) call it.
name: Stress job

on:
  workflow_call:
    inputs:
      minutes:
        description: "Minutes of stress, from the first round (the build, simulator setup and collection not counted)"
        type: number
        required: true
      build_minutes:
        description: "Most minutes the build may take; a build stopped there is continued by the next run"
        type: number
        required: true
      timeout_minutes:
        description: "The job's limit: build_minutes + minutes + 45 (checkout, setup, the last check, issues, artifacts)"
        type: number
        required: true
      trio:
        type: string
        default: "nightscout/Trio:feat/tandem-closed-beta"
      tandemkit:
        type: string
        default: dev
      faketandem_ref:
        type: string
        default: ""
      harness_ref:
        type: string
        default: ""
      seed:
        type: string
        default: ""
      intensity:
        type: string
        default: cycle
      sanitizer:
        type: string
        default: thread
      categories:
        type: string
        default: ""
      file_issues:
        type: boolean
        default: true
      xcode:
        type: string
        default: "26.2"
    secrets:
      TRIO_E2E_APP_ID:
        required: true
      TRIO_E2E_APP_KEY:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  stress:
    runs-on: [self-hosted, macOS, worker]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      # Inputs reach scripts only through env, never interpolated into them.
      IN_TRIO: ${{ inputs.trio || 'nightscout/Trio:feat/tandem-closed-beta' }}
      IN_TANDEMKIT: ${{ inputs.tandemkit || 'dev' }}
      IN_FAKETANDEM_REF: ${{ inputs.faketandem_ref }}
      IN_SEED: ${{ inputs.seed }}
      IN_INTENSITY: ${{ inputs.intensity || 'cycle' }}
      IN_SANITIZER: ${{ inputs.sanitizer || 'thread' }}
      IN_CATEGORIES: ${{ inputs.categories }}
      TH_XCODE_APP: /Applications/Xcode_${{ inputs.xcode || '26.2' }}.app
      TH_SIM_DEVICE: iPhone 17
      TH_TRIO_ORIGIN: nightscout/Trio
      TH_TRIO_REFERENCE: /Volumes/work/mirrors/nightscout/Trio.git
      TH_GIT_MIRRORS: /Volumes/work/mirrors
      TH_WDA_PREBUILT: /Volumes/work/cache/wda/current
    steps:
      - uses: actions/checkout@v4

      - name: Pinned trio-test-harness commit
        id: pin
        env:
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: echo "ref=${HARNESS_REF:-$(git ls-tree HEAD trio-test-harness | awk '{print $3}')}" >> "$GITHUB_OUTPUT"

      # Contents: read on jwoglom/trio-test-harness (the submodule) and jwoglom/TandemKit (Trio's submodule). An App
      # token lasts an hour: the build step fetches everything it needs from GitHub in its first minutes, and the
      # stress step needs nothing from GitHub.
      - name: GitHub App token (jwoglom)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: jwoglom
          repositories: trio-test-harness,TandemKit

      - name: Checkout trio-test-harness
        uses: actions/checkout@v4
        with:
          repository: jwoglom/trio-test-harness
          ref: ${{ steps.pin.outputs.ref }}
          path: trio-test-harness
          token: ${{ steps.token.outputs.token }}

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt -r trio-test-harness/requirements.txt

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests

      # faketandem is Go; it runs pumpX2's cliparser (Java 17+) for message parsing.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Trio and faketandem
        id: build
        env:
          TH_GIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          IN_BUILD_MINUTES: ${{ inputs.build_minutes }}
        run: |
          set -uo pipefail
          args=(--trio "$IN_TRIO" --tandemkit "$IN_TANDEMKIT" --sanitizer "$IN_SANITIZER"
                --build-minutes "$IN_BUILD_MINUTES" --result-json "$RUNNER_TEMP/build-result.json")
          [ -z "$IN_FAKETANDEM_REF" ] || args+=(--faketandem-ref "$IN_FAKETANDEM_REF")
          rc=0
          ./tandemkit-stress build "${args[@]}" || rc=$?
          field() { .venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2], ""))' \
                      "$RUNNER_TEMP/build-result.json" "$1" 2>/dev/null || true; }
          { echo "rc=$rc"; echo "status=$(field status)"; echo "run_dir=$(field run_dir)"; } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stress
        id: stress
        if: steps.build.outputs.status == 'built'
        env:
          RUN_DIR: ${{ steps.build.outputs.run_dir }}
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          set -uo pipefail
          args=(--build "$RUN_DIR" --minutes "$IN_MINUTES" --intensity "$IN_INTENSITY"
                --result-json "$RUNNER_TEMP/stress-result.json")
          [ -z "$IN_SEED" ] || args+=(--seed "$IN_SEED")
          [ -z "$IN_CATEGORIES" ] || args+=(--categories "$IN_CATEGORIES")
          rc=0
          ./tandemkit-stress run "${args[@]}" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # A build break (build rc 3) or findings (stress rc 1). A confirmed driver bug is promoted to TandemKit by a
      # person; nothing is filed there from here.
      - name: File issues
        if: always() && inputs.file_issues && steps.build.outputs.run_dir != '' && (steps.build.outputs.rc == '3' || steps.stress.outputs.rc == '1')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.build.outputs.run_dir }}
        run: ./tandemkit-stress file-issues "$RUN_DIR" --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        if: always() && steps.build.outputs.run_dir != ''
        env:
          RUN_DIR: ${{ steps.build.outputs.run_dir }}
        run: cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run (build log, findings, logs, crash reports, faketandem request log)
        if: always() && steps.build.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: tandemkit-stress-${{ github.run_id }}
          path: ${{ steps.build.outputs.run_dir }}
          retention-days: 14

      - name: Result
        if: always()
        env:
          BUILD: ${{ steps.build.outputs.status }}
          STRESS_RC: ${{ steps.stress.outputs.rc }}
        run: |
          case "$BUILD" in
            built) ;;
            build-incomplete) echo "::notice title=Build incomplete::stopped at build_minutes; the next run continues from DerivedData"; exit 0 ;;
            build-failed) echo "::error title=Build break::Trio does not build against this TandemKit"; exit 1 ;;
            busy) echo "::warning title=Not run::another stress run on this runner's Mac held the lane; see the job summary"; exit 0 ;;
            *) echo "::error title=Harness error::the build step did not complete; see its log"; exit 1 ;;
          esac
          case "${STRESS_RC:-2}" in
            0) echo "clean" ;;
            1) echo "::error title=Stress findings::see the job summary and the issues filed"; exit 1 ;;
            4) echo "::warning title=Not run::another stress run on this runner's Mac took the lane after the build; see the job summary" ;;
            *) echo "::error title=Harness error::the stress step did not complete; see its log"; exit 1 ;;
          esac
